<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadSync</title>
    <style>
      body {
        min-width: 280px;
        margin: 0;
        padding: 16px;
        font:
          14px Arial,
          sans-serif;
        color: #1e293b;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        margin: 12px 0;
        padding: 8px;
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button.secondary {
        margin-top: 8px;
        background: #475569;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      #status {
        min-height: 18px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <strong>LeadSync</strong>
    <button id="auto-extract" type="button">
      ⚡ Auto Extract Page Comments
    </button>
    <textarea id="comments" placeholder="Paste LinkedIn comments..."></textarea>
    <button id="manual-send" class="secondary" type="button">
      Send Manual Text
    </button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
